plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.20'
    id 'maven-publish'
}
version = '0.4.7'
group = 'dev.cinemar2'
base { archivesName = 'cinema-r2' }
repositories { mavenCentral() }
dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2'
    implementation 'net.java.dev.jna:jna:5.15.0'
    include 'net.java.dev.jna:jna:5.15.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}
loom {
    splitEnvironmentSourceSets()
    // RenderType's constructor is private and create(...) is package-private in
    // 26.1.2; widen both so the screen RenderType can be built from dev.cinemar2.client.
    accessWidenerPath = file('src/main/resources/cinemar2.accesswidener')
    mods { cinemar2 { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
test {
    useJUnitPlatform()
    def nativeRuntime = System.getenv('CINEMA_MPV_LIBRARY') ?: 'libmpv-2'
    systemProperty 'cinema.mpv', nativeRuntime
    systemProperty 'cinema.integration', project.findProperty('integrationTest') ?: 'false'
    inputs.property 'consoleIntegration', System.getenv('CINEMA_CONSOLE_TEST') ?: 'false'
    inputs.property 'nativeMatrix', System.getenv('CINEMA_NATIVE_MATRIX') ?: 'false'
    if (file(nativeRuntime).exists()) inputs.file(file(nativeRuntime))
    // Media integration fixtures may need a multi-GB cache; keep them on the workspace disk.
    def mediaTestTemp = layout.buildDirectory.dir('tmp/native-tests').get().asFile
    systemProperty 'java.io.tmpdir', mediaTestTemp.absolutePath
    doFirst { mediaTestTemp.mkdirs() }
}
sourceSets.test.compileClasspath += sourceSets.client.output
sourceSets.test.runtimeClasspath += sourceSets.client.output
sourceSets.test.compileClasspath += sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.runtimeClasspath
tasks.named('compileTestJava') { dependsOn tasks.named('compileClientJava') }
